{% extends "base.html" %}

{% block title %}404 - Page Not Found | AETHER{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
        <div class="toss-card p-5">
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
            </div>
            <h1 class="display-4 fw-bold mb-3">404</h1>
            <h3 class="text-secondary mb-4" data-i18n="error.page_not_found">페이지를 찾을 수 없습니다</h3>
            <p class="text-secondary mb-4" data-i18n="error.page_not_found_desc">
                요청하신 페이지가 존재하지 않거나 이동되었습니다.
            </p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="/" class="btn btn-primary">
                    <i class="bi bi-house-door me-2"></i>홈으로 돌아가기
                </a>
                <a href="/docs" class="btn btn-surface">
                    <i class="bi bi-book me-2"></i>문서 보기
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
